name: Editorial queue inventory
on:
  workflow_dispatch:
  schedule:
    - cron: '25 12 * * 1'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count approved unpublished guides
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          entries = json.loads(Path("content/publishing-queue.json").read_text())["articles"]
          remaining = sum(not (Path("articles") / (a["slug"] + ".html")).exists() for a in entries)
          print(f"Approved unpublished guides: {remaining}")
          if remaining < 4:
              print("WARNING: fewer than two weeks of articles remain; review and replenish the queue.")
          PY
