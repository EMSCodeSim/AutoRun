name: Practical Pick weekly site QA
on:
  workflow_dispatch:
  push:
    paths:
      - '*.html'
      - 'articles/**'
      - 'tools/**'
      - '*.css'
      - 'sitemap.xml'
      - 'scripts/site_audit.py'
  schedule:
    - cron: '0 13 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check page metadata, source links and indexing files
        run: python3 scripts/site_audit.py
