name: Practical Pick monthly tool launch
on:
  workflow_dispatch:
  schedule:
    - cron: '42 15 1-7 * 2'
permissions:
  contents: write
concurrency:
  group: practical-pick-publish
  cancel-in-progress: false
jobs:
  publish-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate queued editorial inputs
        run: |
          python3 -m compileall -q scripts/
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Publish at most one reviewed prebuilt tool
        run: python3 scripts/publish_tool.py
      - name: Run sitemap and link quality checks
        run: python3 scripts/site_audit.py
      - name: Commit tool and navigation updates
        run: |
          git add tools/ index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No approved tool is queued."
            exit 0
          fi
          git -c user.name="Practical Pick Publisher" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Publish approved Practical Pick interactive tool"
          git push origin HEAD:main
